name: Release Builder

on:
  push:
    tags:
      - 'v*'

jobs:
  build-n-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Grabs everything lol

      - name: Set-up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK (Automatically signed)
        run: ./gradlew assembleDebug

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: releasenotes.latest
          files: app/build/outputs/apk/debug/app-debug.apk
